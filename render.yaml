# Render Blueprint — static site, no build step.
services:
  - type: web
    name: devhub
    runtime: static
    buildCommand: echo "No build needed"
    staticPublishPath: .
    # Data commits from the app shouldn't trigger redeploys
    buildFilter:
      ignoredPaths:
        - data/**
        - .github/workflows/android.yml
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
