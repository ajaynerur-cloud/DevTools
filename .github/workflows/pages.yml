name: Deploy to GitHub Pages
# Optional. DevHub runs fully on Render; Pages only adds a second copy of the front end.
# If Pages isn't enabled for this repo, this workflow skips itself instead of failing.
# To enable: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check that GitHub Pages is enabled
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o pages.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ] && grep -q '"build_type": *"workflow"' pages.json; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "200" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages source is a branch::Settings → Pages → Source is set to 'Deploy from a branch'. Change it to 'GitHub Actions' to use this workflow. Skipping."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is off::Pages isn't enabled for this repo, so nothing was deployed. Your Render site is unaffected. To enable: Settings → Pages → Source: GitHub Actions, then run this workflow again."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
      - uses: actions/configure-pages@v5
        if: steps.check.outputs.enabled == 'true'
      - name: Build site (static files only, API on Render)
        if: steps.check.outputs.enabled == 'true'
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          mkdir _site
          cp -r index.html styles.css offline-db.js app.js tasks.js worker.js sw.js manifest.webmanifest favicon.ico icons vendor seed _site/
          touch _site/.nojekyll
          if [ -z "$API_BASE_URL" ]; then echo "::warning::Set the repository variable API_BASE_URL to your Render URL so online sign-in works on Pages. Offline mode and tools work without it."; fi
          printf 'window.DEVHUB_CONFIG = { apiBase: %s };\n' "$(jq -Rn --arg u "${API_BASE_URL%/}" '$u')" > _site/config.js
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.enabled == 'true'
        with: { path: '_site' }
      - id: deployment
        if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
      - name: Show Pages URL
        if: steps.check.outputs.enabled == 'true'
        run: echo "::notice title=Deployed::${{ steps.deployment.outputs.page_url }}"
