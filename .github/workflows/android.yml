name: Build Android APK

# Run from the Actions tab ("Run workflow"), or push a tag like v2.0.0 to also publish a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ vars.ANDROID_APP_ID || 'io.github.devhub' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Use the runner's preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then echo "::error::Android SDK not found on this runner"; exit 1; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls "$SDK"/cmdline-tools/latest/bin/sdkmanager "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKM" ]; then
            # Accept licences so Gradle can download any platform or build-tools version it needs
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          fi
          echo "SDK: $SDK"
          echo "Platforms: $(ls "$SDK/platforms" | tr '\n' ' ')"
          echo "Build tools: $(ls "$SDK/build-tools" | tr '\n' ' ')"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Copy web app into www/
        run: npm run www

      - name: Point the app at your Toolbox+ server
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then echo "::warning::Set the repository variable API_BASE_URL (your Render URL) so the app can sign in. Tools still work offline."; fi
          printf 'window.DEVHUB_CONFIG = { apiBase: %s };\n' "$(jq -Rn --arg u "${API_BASE_URL%/}" '$u')" > www/config.js
          cat www/config.js

      - name: Set app id
        run: jq --arg id "$APP_ID" '.appId = $id' capacitor.config.json > c.tmp && mv c.tmp capacitor.config.json

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add Toolbox+'s native plugin (battery, background and alarm permissions)
        run: |
          # android-src/DevHubPower.java checks battery optimisation, background restriction, exact alarms and notifications,
          # and opens the matching Settings screens (incl. the phone maker's Auto-start screen). MainActivity registers it.
          MA=$(find android/app/src/main/java -name MainActivity.java | head -1)
          if [ -z "$MA" ]; then echo "::error::MainActivity.java not found in the generated Android project"; exit 1; fi
          DIR=$(dirname "$MA"); PKG=$(sed -n 's/^package \(.*\);.*/\1/p' "$MA" | head -1)
          for F in MainActivity DevHubPower Reminders ReminderReceiver BootReceiver; do sed "s/__PKG__/$PKG/" "android-src/$F.java" > "$DIR/$F.java"; done
          echo "Package: $PKG"; ls "$DIR"
          # Receivers: ReminderReceiver shows reminders and handles the Snooze buttons in the background (not exported);
          # BootReceiver sets the alarms again after a restart / app update.
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q ReminderReceiver "$M"; then
            python3 - "$M" <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          rx = '''        <receiver android:name=".ReminderReceiver" android:exported="false" />
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="android.app.action.SCHEDULE_EXACT_ALARM_PERMISSION_STATE_CHANGED" />
                      </intent-filter>
                  </receiver>
              </application>'''
          s = s.replace('</application>', rx, 1); open(p, 'w').write(s)
          PY
          fi
          grep -n "receiver" "$M"

      - name: Declare notification permissions
        run: |
          # Android 13+ needs POST_NOTIFICATIONS declared before the app may ask for it; Android 12+ needs
          # SCHEDULE_EXACT_ALARM for reminders at the exact minute; the rest keep reminders alive after a reboot;
          # USE_BIOMETRIC / USE_FINGERPRINT are for the fingerprint unlock.
          # USE_EXACT_ALARM (Android 13+) grants exact alarms without the user having to switch on "Alarms & reminders",
          # so Insurance renewal and task reminders fire on time, also in battery-saving (Doze) mode.
          # REQUEST_IGNORE_BATTERY_OPTIMIZATIONS lets Toolbox+ show Android's "Let app always run in background?" dialog.
          # No storage permission is needed: attachments are picked with the system file picker.
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM REQUEST_IGNORE_BATTERY_OPTIMIZATIONS RECEIVE_BOOT_COMPLETED VIBRATE WAKE_LOCK USE_BIOMETRIC USE_FINGERPRINT; do
            grep -q "android.permission.$P\"" "$M" || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" "$M"
          done
          grep -n "uses-permission" "$M"

      - name: Apply Toolbox+ icons and launch screen
        run: |
          # android-res/ holds Toolbox+'s launcher icons and splash images (made by scripts/make-icons.py).
          # They replace Capacitor's default icon and the Capacitor logo shown while the app starts.
          RES=android/app/src/main/res
          cp -r android-res/. "$RES/"
          # Android 12+ draws its own launch screen from the theme: give it Toolbox+'s blue instead of white.
          if ! grep -q windowSplashScreenBackground "$RES/values/styles.xml"; then
            sed -i 's#<item name="android:background">@drawable/splash</item>#&\n        <item name="windowSplashScreenBackground">@color/ic_launcher_background</item>#' "$RES/values/styles.xml"
          fi
          # WebView background while the page loads
          jq '.android.backgroundColor = "#3346D3"' capacitor.config.json > c.tmp && mv c.tmp capacitor.config.json
          npx cap copy android
          grep -n "Splash" "$RES/values/styles.xml"
          ls "$RES/mipmap-anydpi-v26" "$RES/drawable-port-xxxhdpi"

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="3.0.${{ github.run_number }}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName|applicationId" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "../ToolboxPlus-${VERSION}-debug.apk"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          (cd android && ./gradlew assembleRelease --no-daemon)
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "ToolboxPlus-${VERSION}-release.apk" aligned.apk
          "$BT/apksigner" verify "ToolboxPlus-${VERSION}-release.apk"
          rm -f release.keystore aligned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToolboxPlus-${{ env.VERSION }}-apk
          path: ToolboxPlus-*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ToolboxPlus-*.apk
          generate_release_notes: true
